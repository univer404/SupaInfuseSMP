name: Infuse
version: 1.0.0
main: net.infuse.plugin.InfusePlugin
api-version: '1.21'
authors: [SupaInfuseSMP]
description: Java implementation of the Infuse effects system.
softdepend: [PlaceholderAPI, WorldGuard, Geyser-Spigot, floodgate]
commands:
  infuse:
    description: Open Infuse and manage equipped effects.
    usage: /infuse [gui|give|reload|trust]
    aliases: [infuses]
  trust:
    description: Manage players trusted by your Infuse effects.
    usage: /trust <add|remove|list|clear> [player]
  use:
    description: Activate the Spark in one of your Infuse slots.
    usage: /use <primary|secondary>
    aliases: [u, activate]
  swap:
    description: Swap your primary and secondary Infuse effects.
    usage: /swap
    aliases: [swapeff, swapeffects, swapslots]
  recipes:
    description: View Infuse crafting guidance.
    usage: /recipes
  control:
    description: Bind primary or secondary Spark to a player action.
    usage: /control <primary|secondary> <action>
    aliases: [controls, controlset, bind]
permissions:
  infuse.admin:
    description: Manage Infuse settings and items.
    default: op
  infuse.use:
    description: Use Infuse features.
    default: true
