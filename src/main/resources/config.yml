settings:
  disabled-worlds:
    - disabled_world
  allow-same-effects: false
  allow-true-damage: true
  lock-effects: false
  primary-effects: [heart, strength, regeneration, haste, invisibility, frost, thunder, feather]
  secondary-effects: [speed, fire, ocean, emerald]
  trust-list-max: 3
  trust-list-delay-seconds: 10
  do-roll-animation: true
  roll-first-join: false
  head-drop: false
  use-sound: "custom.activate"
  recharge-sound: "custom.health"
  resource-pack:
    enabled: true
    url: "https://raw.githubusercontent.com/o-hex/InfuseS3/main/_texturepack.zip"
    sha1: "2a4079e2f08424192e4ee8b8d3df26d1f386cd15"
    prompt: "Infuse includes custom textures. Download the official resource pack to see them."
