name: Build Infuse
on:
  push:
    branches: [main, "conversion/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate configured resource pack
        run: |
          python - <<'PY'
          import hashlib, io, json, re, urllib.request, zipfile
          with open("src/main/resources/config.yml", encoding="utf-8") as f:
              config_text = f.read()
          match = re.search(r"(?ms)^  resource-pack:\s*\n(?P<section>(?:^    .*\n|^\s*\n)*)", config_text)
          if not match:
              raise SystemExit("Missing settings.resource-pack section in config.yml.")
          section = match.group("section")
          enabled = re.search(r"(?m)^    enabled:\s*(true|false)\s*$", section)
          if not enabled or enabled.group(1).lower() != "true":
              print("Resource pack delivery is disabled; skipping validation.")
              raise SystemExit(0)
          url_match = re.search(r'(?m)^    url:\s*"([^"]+)"', section)
          sha_match = re.search(r'(?m)^    sha1:\s*"([0-9a-fA-F]{40})"', section)
          if not url_match or not sha_match:
              raise SystemExit("Resource pack URL or 40-character SHA-1 is missing.")
          url = url_match.group(1).strip()
          expected = sha_match.group(1).lower()
          if not url.startswith("https://") or len(expected) != 40:
              raise SystemExit("Resource pack must have an HTTPS URL and a 40-character SHA-1.")
          request = urllib.request.Request(url, headers={"User-Agent": "SupaInfuseSMP-resource-pack-check"})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read()
          actual = hashlib.sha1(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"Resource-pack SHA-1 mismatch: expected {expected}, got {actual}")
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt resource-pack entry: {bad}")
              if "pack.mcmeta" not in archive.namelist():
                  raise SystemExit("Resource pack ZIP is missing root pack.mcmeta.")
              metadata = json.loads(archive.read("pack.mcmeta"))
              pack_meta = metadata.get("pack", {})
              if not any(k in pack_meta for k in ("min_format", "max_format", "pack_format")):
                  raise SystemExit("pack.mcmeta has no recognized format metadata.")
              print(f"Resource pack OK: {len(data)} bytes, SHA-1 {actual}")
              print(f"pack.mcmeta: {json.dumps(pack_meta, ensure_ascii=False)}")
              print(f"Entries: {len(archive.namelist())}")
          PY
      - name: Prepare Minecraft 1.21.11 texture pack
        run: |
          python - <<'PY'
          import hashlib, io, json, urllib.request, zipfile
          source_url = "https://raw.githubusercontent.com/o-hex/InfuseS3/main/_texturepack.zip"
          request = urllib.request.Request(source_url, headers={"User-Agent": "SupaInfuseSMP-pack-builder"})
          with urllib.request.urlopen(request, timeout=30) as response:
              original = response.read()
          original_sha1 = hashlib.sha1(original).hexdigest()
          expected_original_sha1 = "2a4079e2f08424192e4ee8b8d3df26d1f386cd15"
          if original_sha1 != expected_original_sha1:
              raise SystemExit(f"Upstream pack changed: expected {expected_original_sha1}, got {original_sha1}")
          source = zipfile.ZipFile(io.BytesIO(original))
          if "pack.mcmeta" not in source.namelist():
              raise SystemExit("Original texture pack is missing root pack.mcmeta.")
          metadata = json.loads(source.read("pack.mcmeta"))
          pack = metadata.setdefault("pack", {})
          old_format = pack.get("pack_format", "modern metadata")
          pack["pack_format"] = 75
          pack["description"] = "InfuseSMP resource pack - updated metadata for Minecraft 1.21.11"
          output = io.BytesIO()
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as target:
              for info in source.infolist():
                  data = source.read(info.filename)
                  if info.filename == "pack.mcmeta":
                      data = (json.dumps(metadata, ensure_ascii=False, indent=2) + "\\n").encode("utf-8")
                  target.writestr(info, data)
          result = output.getvalue()
          with zipfile.ZipFile(io.BytesIO(result)) as check:
              bad = check.testzip()
              if bad:
                  raise SystemExit(f"Generated pack has corrupt entry: {bad}")
              checked_metadata = json.loads(check.read("pack.mcmeta"))
              if checked_metadata.get("pack", {}).get("pack_format") != 75:
                  raise SystemExit("Generated pack metadata does not declare pack_format 75.")
          import os
          os.makedirs("target", exist_ok=True)
          output_path = "target/Infuse-Texture-Pack-1.21.11.zip"
          with open(output_path, "wb") as f:
              f.write(result)
          print(f"Updated pack metadata from {old_format} to 75.")
          print(f"Original SHA-1: {original_sha1}")
          print(f"NEW_PACK_SHA1={hashlib.sha1(result).hexdigest()}")
          print(f"Output: {output_path} ({len(result)} bytes)")
          PY
      - name: Upload updated texture pack
        uses: actions/upload-artifact@v4
        with:
          name: Infuse-Texture-Pack-1.21.11
          path: target/Infuse-Texture-Pack-1.21.11.zip
          if-no-files-found: error
          retention-days: 14
      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Infuse-1.0.0
          path: target/Infuse.jar
          if-no-files-found: error
          retention-days: 14
